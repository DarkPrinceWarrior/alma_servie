[project]
name = "alma-service"
version = "0.1.0"
description = "Research library for alma_servie anomaly detection (PaAno + PCA/SPE + onset)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ruslan_safaev", email = "ds.mind.lab@gmail.com" }]
# Runtime dependencies for the research stack are managed via requirements.txt
# (torch/numba/optuna/pandas/plotly etc). This pyproject only exposes the
# `alma_service` package so it can be installed editable from app/back and
# other consumers. Do not duplicate requirements.txt here.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alma_service"]

[tool.hatch.build.targets.sdist]
include = ["alma_service", "README.md", "requirements.txt"]
