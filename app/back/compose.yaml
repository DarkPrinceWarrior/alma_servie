name: alma_servie

services:
  backend:
    build:
      context: ../..
      dockerfile: app/back/Dockerfile
    container_name: alma_servie_api
    env_file:
      - .env
    environment:
      ENVIRONMENT: docker
      DEBUG: "false"
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/alma_servie
      DATA_ROOT: /data
      RESEARCH_ROOT: /workspace
      DETECTION_MOCK: "false"
    volumes:
      - ../..:/data:ro
      - ../..:/workspace:ro
      - uploads:/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: app/back/worker/Dockerfile
    container_name: alma_servie_worker
    profiles: ["heavy"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: docker
      DEBUG: "false"
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/alma_servie
      DATA_ROOT: /data
      RESEARCH_ROOT: /workspace
      DETECTION_MOCK: "false"
    volumes:
      - ../..:/data
      - ../..:/workspace:ro
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: app/front/Dockerfile
      args:
        API_BASE_URL: http://backend:8000
    container_name: alma_servie_front
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: alma_servie_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: alma_servie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d alma_servie"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
